name: IP-Link Android

on:
  push:
    branches: [residential-route]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ip-link-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build tools
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libclang-18-dev
          test -e /usr/lib/llvm-18/lib/libclang.so

      - name: Resolve dependencies and analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Test residential routing
        run: |
          cp pubspec.yaml /tmp/ip-link-pubspec.yaml
          trap 'cp /tmp/ip-link-pubspec.yaml pubspec.yaml' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          p.write_text(p.read_text().replace('build_assets: true', 'build_assets: false'))
          PY
          flutter test --reporter expanded test/common/residential_route_test.dart test/common/residential_route_task_test.dart test/common/residential_route_connection_test.dart test/widgets/residential_route_editor_test.dart test/widgets/residential_route_view_test.dart test/providers/setup_action_test.dart

      - name: Build ARM64 APK
        run: |
          cp pubspec.yaml /tmp/ip-link-build-pubspec.yaml
          trap 'cp /tmp/ip-link-build-pubspec.yaml pubspec.yaml' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          old = '    rust_api:\n      build_assets: true'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, old + '\n      libclang_path: /usr/lib/llvm-18/lib'))
          PY
          grep -A 2 'rust_api:' pubspec.yaml | grep 'build_assets: true'
          grep -A 2 'setup:' pubspec.yaml | grep 'build_assets: true'
          flutter build apk --release --target-platform android-arm64 --split-per-abi --no-pub

      - name: Prepare install package
        run: |
          python3 - <<'PY'
          import struct, zipfile
          apk = 'build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          with zipfile.ZipFile(apk) as z:
              libs = [n for n in z.namelist() if n.endswith('.so')]
              assert libs
              for name in libs:
                  data = z.read(name)
                  assert struct.unpack_from('<H', data, 18)[0] == 183, name
                  offset = struct.unpack_from('<Q', data, 32)[0]
                  size, count = struct.unpack_from('<HH', data, 54)
                  headers = [struct.unpack_from('<IIQQQQQQ', data, offset + i * size) for i in range(count)]
                  loads = [h for h in headers if h[0] == 1]
                  assert loads and all(h[7] >= 16384 for h in loads), name
                  relro = [h for h in headers if h[0] == 0x6474e552]
                  shoff = struct.unpack_from('<Q', data, 40)[0]
                  shsize, shcount = struct.unpack_from('<HH', data, 58)
                  sections = [struct.unpack_from('<IIQQQQIIQQ', data, shoff + i * shsize) for i in range(shcount)]
                  writable = [s for s in sections if s[2] & 3 == 3 and s[5]]
                  for h in relro:
                      start, end = h[3], h[3] + h[6]
                      rounded_start = start // 16384 * 16384
                      rounded_end = (end + 16383) // 16384 * 16384
                      padding = [(rounded_start, start), (end, rounded_end)]
                      assert not any(a < b and s[3] < b and s[3] + s[5] > a for a, b in padding for s in writable), name
                  print('ARM64 and 16KB alignment verified:', name)
          PY
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/FlClash-IP-Link-arm64.apk
          cp IP_LINK.md LICENSE dist/
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          cd dist
          sha256sum FlClash-IP-Link-arm64.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-IP-Link-arm64
          path: dist/
          retention-days: 14
